name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm test

  windows-build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs everything on real Windows too. MIKO_REAL_NETWORK_CHECK also
      # runs the network check's PowerShell route/VPN detection against this
      # machine. Node 22 expands test/*.test.js itself; cmd.exe doesn't.
      - run: npm test
        env:
          MIKO_REAL_NETWORK_CHECK: "1"
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: miko-windows-installer
          path: release/*.exe
          retention-days: 14
